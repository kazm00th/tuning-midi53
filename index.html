<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>53平均律で純正に鳴る MIDI 鍵盤</title>
  <style>
    :root {
      --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --bg: #ffffff; --panel: #f6f8fa;
      --accent: #0969da; --held: #ffd166; --sustain: #ffe9b0; --common: #c1121f; --grid: #c8d1da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --bg: #0d1117; --panel: #151b23;
        --accent: #4493f8; --held: #b58900; --sustain: #6b5a1e; --common: #ff6b6b; --grid: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); line-height: 1.5; }
    main { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 12px; font-size: 0.95rem; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 16px;
      padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    .controls label { display: flex; flex-direction: column; gap: 2px; font-size: 0.9rem; min-width: 0; }
    .controls select, .controls input[type="number"] { font: inherit; padding: 3px 6px; color: var(--fg);
      background: var(--bg); border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent);
      background: var(--accent); color: #fff; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); }
    .status { color: var(--muted); font-size: 0.9rem; }
    .toggles { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 12px 0 4px; font-size: 0.9rem; }
    .view { margin: 12px 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
    .view h2 { font-size: 1rem; margin: 0 0 6px; }
    .view[hidden] { display: none; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
    th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: normal; }
    .chord-line { margin: 0 0 6px; font-size: 0.95rem; }
    .common { color: var(--common); font-weight: 600; }
    svg { display: block; max-width: 100%; height: auto; }
    .help { color: var(--muted); font-size: 0.88rem; }
    kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 0.85em; }
  </style>
  <script src="tuning53.js" defer></script>
  <script src="engine.js" defer></script>
  <script src="voices.js" defer></script>
  <script src="input.js" defer></script>
  <script src="views.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>53平均律で純正に鳴る MIDI 鍵盤</h1>
    <p class="lead">12 の鍵で弾いた和音を、53 平均律の段で純正に鳴らします。共通音を押したまま和音を移ると、純正律と同じく全体が少しずつずれていきます。</p>

    <div class="row" style="margin-bottom:8px">
      <button id="start" type="button">音を出す</button>
      <span id="audio-status" class="status">「音を出す」を押すと音が出ます（ブラウザの決まりで、最初の操作が要ります）。</span>
    </div>

    <section class="controls" aria-label="設定">
      <label>MIDI 入力
        <select id="midi-input"><option value="">（なし）</option></select>
        <span id="midi-status" class="status"></span>
      </label>
      <label>共通音が無いときの置き直し
        <select id="place-mode">
          <option value="root">根音を 12 平均律に合わせる</option>
          <option value="average">和音全体で均す</option>
        </select>
      </label>
      <label>あとから合わなくなった音
        <select id="fix-mode">
          <option value="move">動かして純正にする</option>
          <option value="keep">動かさない</option>
        </select>
      </label>
      <label>基準 A4（Hz）
        <input id="a4" type="number" value="440" min="200" max="1000" step="0.1">
      </label>
      <label>音量
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
      </label>
      <div class="row">
        <button id="reset" type="button" class="secondary">ずれをリセット</button>
        <span class="status">PC のキーボード：<span id="octave">C4</span></span>
      </div>
    </section>

    <div class="toggles" aria-label="表示">
      <label><input type="checkbox" id="show-table" checked> A 鳴っている音</label>
      <label><input type="checkbox" id="show-keyboard" checked> B 鍵盤</label>
      <label><input type="checkbox" id="show-lattice" checked> C 格子と根音の道</label>
      <label><input type="checkbox" id="show-circle" checked> D 53 段の円</label>
    </div>

    <section class="view" id="view-table"><h2>A 鳴っている音</h2><div class="body"></div></section>
    <section class="view" id="view-keyboard"><h2>B 鍵盤</h2><div class="body"></div></section>
    <section class="view" id="view-lattice"><h2>C 格子と根音の道</h2><div class="body"></div></section>
    <section class="view" id="view-circle"><h2>D 53 段の円</h2><div class="body"></div></section>

    <p class="help">PC のキーボード：<kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> が白鍵（C〜D）、<kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd><kbd>O</kbd><kbd>P</kbd> が黒鍵、<kbd>Z</kbd>/<kbd>X</kbd> でオクターブ、<kbd>Space</kbd> がペダル。音名は篠原 2019 と同じ書き方で、右肩の数はシントニック・コンマの指数、(7) は 7 倍音（7/4）。</p>
  </main>
</body>
</html>
